plugins {
    id 'com.android.application'
}

// Screenshot upload is development tooling: it draws the screen and posts it to a
// laptop. Off unless asked for, so the published build cannot send a picture anywhere.
def screenshotUpload = providers.gradleProperty('screenshotUpload').orElse('false').get()
def diagnosticServerUrl = providers.gradleProperty('diagnosticServerUrl').orElse('').get()
def escapedDiagnosticServerUrl = diagnosticServerUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"')

android {
    namespace 'com.codex.waterrowerdiagnostic'
    compileSdk 35

    defaultConfig {
        applicationId 'com.codex.waterrowerdiagnostic'
        minSdk 23
        targetSdk 28
        versionCode 92
        versionName '3.19.6'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', "\"${escapedDiagnosticServerUrl}\""
        buildConfigField 'boolean', 'SCREENSHOT_UPLOAD', "${screenshotUpload == 'true'}"
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.9.0'
}
